version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: siakad_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: siakad_mini_fahmi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
